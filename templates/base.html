<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Smart Civic Services{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="grid-overlay" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <span class="brand-mark">CS</span>
      <span class="brand-text">Civic<strong>Signal</strong></span>
    </a>
    <nav class="topnav">
      <a href="/" class="{% block nav_citizen %}{% endblock %}">Report a Problem</a>
      <a href="/admin" class="{% block nav_admin %}{% endblock %}">Service Desk</a>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="sitefooter">
  <span>AI Smart Civic Services &mdash; complaint intake, classification &amp; triage, prototype build</span>
</footer>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
